<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>UKETA</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1a1410;color:#f3e6cf;font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;text-align:center}</style>
</head>
<body>
<p id="m">記録を引き継いでいます…</p>
<script>
(function(){
  var P='UKETA_MOVE:',raw=window.name||'',moved=0;
  window.name='';
  // Only accept data handed over by the old UKETA address, never from other sites.
  var ref=document.referrer||'';
  var fromOld=/^https:\/\/uketa-log\.netlify\.app(\/|$)/.test(ref);
  var ID=/^[A-Za-z0-9_-]{11}$/;
  var str=function(v,n){return typeof v==='string'?v.slice(0,n):''};
  var num=function(v){v=Number(v);return isFinite(v)?v:0};
  function clean(id,d){
    if(!d||typeof d!=='object'||d.kind!=='w'||typeof id!=='string'||id.length>40)return null;
    var vid=str(d.vid,20);if(!ID.test(vid))return null;
    var r=Number(d.r);if([1,0,-1,-2].indexOf(r)<0)return null;
    var o={kind:'w',vid:vid,r:r,fav:d.fav===true,gid:str(d.gid,60),gname:str(d.gname,60),title:str(d.title,120),
      at:str(d.at,40),sec:num(d.sec),fmt:['m','k','p'].indexOf(d.fmt)>=0?d.fmt:'m',
      url:'https://www.youtube.com/watch?v='+vid,
      styles:Array.isArray(d.styles)?d.styles.filter(function(s){return typeof s==='string'&&/^[a-z]{1,12}$/.test(s)}).slice(0,12):[]};
    if(d.side==='m'||d.side==='k')o.side=d.side;
    if(typeof d.note==='string'&&d.note)o.note=d.note.slice(0,500);
    if(d.omOnly===true)o.omOnly=true;
    if(d.omN!=null)o.omN=Math.max(0,Math.min(1000,Math.floor(num(d.omN))));
    if(typeof d.ver==='string')o.ver=d.ver.slice(0,10);
    return o;
  }
  if(fromOld&&raw.indexOf(P)===0){
    try{
      var d=JSON.parse(raw.slice(P.length));
      var LS='owarai-techo-v1';
      if(d&&typeof d[LS]==='string'){
        var inc=JSON.parse(d[LS])||{},cur={};
        try{cur=JSON.parse(localStorage.getItem(LS)||'{}')||{}}catch(e){cur={}}
        var n=0;
        for(var k in inc){if(n>=5000)break;if(Object.prototype.hasOwnProperty.call(inc,k)&&!(k in cur)){var c=clean(k,inc[k]);if(c){cur[k]=c;moved++;n++}}}
        localStorage.setItem(LS,JSON.stringify(cur));
      }
      if((d['uketa-noshimo']==='1'||d['uketa-noshimo']==='0')&&localStorage.getItem('uketa-noshimo')==null)localStorage.setItem('uketa-noshimo',d['uketa-noshimo']);
    }catch(e){}
  }
  try{if(moved)sessionStorage.setItem('uketa-moved',String(moved))}catch(e){}
  location.replace('./'+(/^#[a-z]{1,12}$/.test(location.hash)?location.hash:''));
})();
</script>
</body>
</html>
