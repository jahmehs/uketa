<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UKETA</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1a1410;color:#f3e6cf;font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;text-align:center}</style>
</head>
<body>
<p id="m">記録を引き継いでいます…</p>
<script>
(function(){
  var P='UKETA_MOVE:',raw=window.name||'',moved=0;
  if(raw.indexOf(P)===0){
    try{
      var d=JSON.parse(raw.slice(P.length));
      var LS='owarai-techo-v1';
      if(d[LS]){
        var inc=JSON.parse(d[LS])||{},cur={};
        try{cur=JSON.parse(localStorage.getItem(LS)||'{}')||{}}catch(e){cur={}}
        for(var k in inc){if(!(k in cur)){cur[k]=inc[k];moved++}}
        localStorage.setItem(LS,JSON.stringify(cur));
      }
      if(d['uketa-noshimo']!=null&&localStorage.getItem('uketa-noshimo')==null)localStorage.setItem('uketa-noshimo',d['uketa-noshimo']);
      if(d['uketa-fb-outbox']){
        var a=[],b=[];try{a=JSON.parse(localStorage.getItem('uketa-fb-outbox')||'[]')||[]}catch(e){}
        try{b=JSON.parse(d['uketa-fb-outbox'])||[]}catch(e){}
        localStorage.setItem('uketa-fb-outbox',JSON.stringify(a.concat(b)));
      }
    }catch(e){}
  }
  window.name='';
  try{if(moved)sessionStorage.setItem('uketa-moved',String(moved))}catch(e){}
  location.replace('./'+(location.hash||''));
})();
</script>
</body>
</html>
