<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UKETA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Yuji+Syuku&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE: variety-show energy, kept tidy like a theatre programme
   IDEA: a yose stage: red curtains, a mekuri on its wooden stand, one act at a time
   PICTURE: the stage itself (mic for manzai, folding table and pipe chair for konto) on the watch tab; a telop-lettered owarai age on the scorecard
   COLOUR and TYPE: vermilion curtain, spotlight gold, telop yellow stroked in ink; Dela Gothic One + Zen Kaku Gothic New
   LAYOUT: red header with three tabs; a phone-width stage centred on any screen; scorecard hero then paired panels */
:root{color-scheme:light dark;
--bg:light-dark(#f3f0eb,#15110f);--paper:light-dark(#fff,#211a17);--ink:light-dark(#1d1714,#f3ece6);
--mute:light-dark(#6b605a,#a99d95);--line:light-dark(#e2dbd2,#3a302b);--chip:light-dark(#f0ebe5,#2d2521);
--red:light-dark(#d63b22,#c2351e);--yel:#ffd21f;--blue:light-dark(#2f4a9a,#3d5cc4)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Zen Kaku Gothic New',system-ui,sans-serif;overflow-x:clip}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.telop{font-family:'Dela Gothic One',sans-serif;font-weight:400;color:var(--yel);-webkit-text-stroke:.14em #1d1714;paint-order:stroke fill;text-shadow:.04em .07em 0 #1d1714;line-height:1.08}
.top{background:var(--red);color:#fff;padding:16px max(5vw,16px) 0}
.in{max-width:1240px;margin:0 auto}
.brand{display:flex;flex-wrap:wrap;align-items:flex-end;gap:4px 18px}
h1.telop{font-size:clamp(30px,5vw,44px);margin:0}
.brand p{margin:0 0 6px;font-size:14px}
.tabs{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
.tabs a{flex:none;color:#fff;text-decoration:none;padding:10px 20px;border-radius:12px 12px 0 0;font-weight:700;min-height:44px}
.tabs a[aria-current=page]{background:var(--bg);color:var(--ink)}
.tabs b{background:var(--yel);color:#1d1714;border-radius:99px;padding:0 8px;font-size:13px;margin-left:6px}
.tabs b:empty{display:none}
.note{background:var(--yel);color:#1d1714;padding:8px max(5vw,16px);font-size:14px;font-weight:700}
main{padding:20px max(5vw,16px) 64px}
#v-watch{padding:0}
.btn{min-height:44px;padding:8px 18px;border-radius:10px;border:0;background:var(--red);color:#fff;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.link{background:none;border:0;color:var(--red);font-weight:700;text-decoration:underline;cursor:pointer;padding:0}
.empty{padding:28px;text-align:center;color:var(--mute);background:var(--paper);border-radius:14px;border:1.5px dashed var(--line)}
/* stage */
.stage{position:relative;max-width:430px;margin:0 auto;border-radius:22px;overflow:hidden;color:#fff;background:radial-gradient(ellipse 62% 40% at 50% 26%,#fff4c9 0%,#f0c95a 20%,#5a3a2c 55%,#140f0d 85%);box-shadow:0 14px 34px rgba(0,0,0,.28)}
.cur{position:absolute;top:0;bottom:0;width:48px;z-index:1}
.cur.l{left:0;background:repeating-linear-gradient(90deg,#b42d18 0 12px,#8f2312 12px 17px)}
.cur.r{right:0;background:repeating-linear-gradient(90deg,#8f2312 0 5px,#b42d18 5px 17px)}
.val{position:absolute;left:0;right:0;top:0;height:60px;z-index:2;background:repeating-linear-gradient(180deg,#a82a16 0 18px,#8f2312 18px 22px)}
.boards{position:relative;z-index:0;padding:84px 56px 0;display:flex;flex-direction:column;align-items:center}
.ttl{margin:0;text-align:center;text-wrap:balance}
.scene{position:relative;width:100%;margin-top:14px}
.mek{position:absolute;left:0;bottom:0}
.prop{position:absolute;bottom:0}
.play{display:flex;align-items:flex-start;gap:14px;margin:8px 0 0;width:100%;justify-content:center}
.play .pl{flex:0 1 auto;min-width:0;min-height:78px;display:flex;flex-direction:column;justify-content:center;gap:6px;align-items:flex-end}
.play .pl .tg{justify-content:flex-end}
.play .pl .hint{text-align:right;font-size:12.5px;white-space:nowrap}
.play .pr{display:flex;flex-direction:column;align-items:center;gap:0;flex:none;line-height:1.25}
.play .pr a{margin-bottom:4px}
.play .pr .dur{font-size:11.5px;font-weight:700;color:#c9bfb4}
.play a{width:78px;height:78px;border-radius:39px;background:var(--yel);border:4px solid #1d1714;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(0,0,0,.4);transition:transform .15s}
.play a:active{transform:scale(.94)}
.play .pr p{margin:0;font-size:12px;white-space:nowrap;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.pit{position:relative;z-index:3;margin-top:-34px;padding:6px 20px 20px;background:linear-gradient(180deg,rgba(20,15,13,0) 0%,rgba(20,15,13,.9) 34%,#140f0d 100%);display:flex;flex-direction:column;gap:10px}
.tg{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tg span{background:rgba(255,255,255,.16);font-size:13px;font-weight:700;padding:2px 9px;border-radius:6px}
.hint{margin:0;font-size:13px;color:#c9bfb4;text-align:center}
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rb{min-height:52px;border-radius:14px;border:2px solid;font-weight:700;font-size:16px;cursor:pointer;white-space:nowrap}
.rb:disabled{border-color:rgba(255,255,255,.16)!important;background:rgba(255,255,255,.05)!important;color:#7d726b!important;cursor:not-allowed}
.rb.u{border-color:var(--yel);background:var(--yel);color:#1d1714}
.rb.m{border-color:#c9bfb4;background:transparent;color:#fff}
.rb.s{border-color:#8fa6ea;background:transparent;color:#fff}
.rb.a{border-color:#8a7f78;border-style:dashed;background:transparent;color:#e9e1da}
.today{margin:4px 0 0;font-size:14px;font-weight:700;text-align:center}
.fine{margin:0;font-size:13px;line-height:1.5;color:#c9bfb4;text-align:center}
.done{padding:120px 56px 140px;text-align:center}
.stamp{position:absolute;left:0;right:0;top:34%;z-index:7;text-align:center;pointer-events:none;font-size:clamp(44px,13vw,60px);margin:0;animation:stampIn .45s cubic-bezier(.2,1.6,.4,1) both}
.stamp.s-1{color:#cfd9ff;animation:stampDrop .55s ease-in both}.stamp.s0{color:#fff}.stamp.s-2{color:#c9bfb4;font-size:clamp(36px,10vw,48px)}
@keyframes stampIn{from{transform:scale(2.2) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(-4deg);opacity:1}}
@keyframes stampDrop{0%{transform:translateY(-30px);opacity:0}40%{transform:translateY(0);opacity:1}100%{transform:translateY(18px) rotate(3deg);opacity:1}}
.drape{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:hidden}
.drape i{position:absolute;top:0;bottom:0;width:51%;transition:transform .5s cubic-bezier(.6,0,.3,1);box-shadow:0 0 24px rgba(0,0,0,.5)}
.drape .dl{left:0;transform:translateX(-100%);background:repeating-linear-gradient(90deg,#b42d18 0 22px,#8f2312 22px 30px)}
.drape .dr{right:0;transform:translateX(100%);background:repeating-linear-gradient(90deg,#8f2312 0 8px,#b42d18 8px 30px)}
.drape.shut i{transform:translateX(0)}
.stage{transition:opacity .25s}
.stage.busy .rb,.stage.busy .play a{pointer-events:none}
.drape.slow i{transition-duration:2.6s}
.later{position:absolute;left:50%;top:56%;z-index:8;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:132px;min-height:104px;padding:10px 18px;border:0;border-radius:20px;background:rgba(20,15,13,.62);cursor:pointer;color:#fff;font-weight:700;font-size:15px;text-shadow:0 1px 4px rgba(0,0,0,.8);animation:laterIn .35s ease-out .55s both}
.later b{font-size:64px;line-height:1;color:transparent;-webkit-text-stroke:2.5px #ffd21f;transition:color .2s,transform .3s cubic-bezier(.2,1.8,.4,1),text-shadow .3s}
.later.on b{color:#ffd21f;transform:scale(1.25) rotate(-8deg);text-shadow:0 0 24px #ffe98a,0 0 48px #ffd21f}
.later.on span::after{content:' ✓'}
@keyframes laterIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@media(prefers-reduced-motion:reduce){.later{animation:none}.later b{transition:none}}
.favb{background:none;border:0;font-size:22px;line-height:1;cursor:pointer;color:#c9bfb4;min-width:44px;min-height:44px}
.favb.on{color:#e0a800}
.lfilt{display:flex;gap:4px}.lfilt button{min-height:40px;padding:4px 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--paper);font-weight:700;cursor:pointer;color:var(--ink)}
.lfilt button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
@media(prefers-reduced-motion:reduce){.stamp{animation:none}.drape i{transition:none}}
/* log */
.head2{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.head2 h2{margin:0;font-size:24px}
.omhead{background:radial-gradient(ellipse 60% 80% at 50% 0,#4b3a2c 0,#241b16 70%);color:#fff;border-radius:16px;border-left:8px solid #b42d18;border-right:8px solid #b42d18;padding:14px 16px;margin-bottom:12px;text-align:center}
.omtop{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:0 0 8px}
.omt{font-size:28px;margin:0}
.tix{position:relative;display:flex;align-items:baseline;justify-content:center;min-width:96px;gap:4px;padding:6px 18px 6px 16px;border-radius:8px;-webkit-mask:radial-gradient(circle 7px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 7px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 7px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 7px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat}
.tix .tl{white-space:nowrap;font-size:10px;font-weight:700;letter-spacing:.12em;align-self:center;writing-mode:vertical-rl;text-orientation:upright;line-height:1;margin-right:4px}
.tix .tn{font-family:'Dela Gothic One',sans-serif;font-weight:400;font-size:40px;line-height:1}
.tix .tu{font-size:14px;font-weight:700}
.tix.gold{background:linear-gradient(135deg,#8a6a14 0,#f7d774 22%,#fff3b0 38%,#d4a72c 55%,#f7d774 75%,#9c7a1c 100%);color:#5a3d00;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.tix.gold .tn{color:#c8161d;text-shadow:0 1px 0 #fff3b0}
.tix.gold{padding:14px 22px 14px 22px;overflow:hidden}
.tix .ww{position:absolute;font-style:normal;font-size:10px;font-weight:700;line-height:1;color:#7a5a08;opacity:.75;white-space:nowrap;letter-spacing:-.02em;pointer-events:none}
.tix .ww.wwt{top:2px;left:0;right:0;text-align:center}.tix .ww.wwb{bottom:2px;left:0;right:0;text-align:center;transform:rotate(180deg)}
.tix .ww.wwl,.tix .ww.wwr{top:12px;bottom:12px;writing-mode:vertical-rl;display:flex;justify-content:space-between}.tix .ww.wwl{left:3px}.tix .ww.wwr{right:3px}
.tix.empty{-webkit-mask:none;mask:none;border:2px dashed #8a7a6c;color:#bfb3a8;background:transparent}
.tix.empty .tn{color:#e0574c}
.tix.empty .tl{writing-mode:horizontal-tb;font-size:9px;position:absolute;top:3px;left:16px;margin:0}
.tix.empty{padding-top:14px}
.omtx{margin:0 0 10px;font-size:13px;color:#d9cfc6}.omtx b{color:#ffd21f}
.omtk{margin:0 0 10px;display:flex;flex-direction:column;gap:2px;font-size:13px;color:#d9cfc6}.omtk b{color:#ffd21f}.omtk>b{font-size:17px}
#omq{width:100%;max-width:420px;min-height:44px;border-radius:12px;border:1.5px solid #4a3d34;background:#2e2520;color:#fff;padding:8px 14px;font-size:16px}
.omwrap{position:relative}
.omar{position:absolute;top:calc(50% - 46px);z-index:5;width:52px;height:52px;border-radius:50%;border:2px solid #ffd21f;background:rgba(29,23,20,.85);color:#ffd21f;font-size:34px;line-height:1;display:none;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.35);user-select:none;-webkit-user-select:none;touch-action:none;padding:0 0 4px}
.omar.omar-l{left:6px}.omar.omar-r{right:6px}
@media(hover:hover){.omwrap:hover .omar{display:flex}}
.omscroll{scrollbar-color:#b8860b #2a211c;scrollbar-width:auto}
.omscroll::-webkit-scrollbar{height:16px}.omscroll::-webkit-scrollbar-track{background:#2a211c;border-radius:8px}.omscroll::-webkit-scrollbar-thumb{background:linear-gradient(90deg,#8a6a14,#f7d774,#d4a72c);border-radius:8px;border:3px solid #2a211c}
.omscroll{direction:rtl;display:flex;align-items:flex-start;gap:22px;overflow-x:auto;overflow-y:hidden;padding:4px 20px 8px;margin:0 -10px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.omk{direction:ltr;flex:none;display:flex;flex-direction:column;align-items:center;background:none;border:0;padding:0;cursor:pointer;color:inherit}
.omk-bar{display:block;height:14px;background:#8a5a2e;border-radius:3px;box-shadow:0 3px 0 #5e3b1e;position:relative;z-index:2}
.omk-frame{position:relative;display:flex;justify-content:center;padding:0 0 0;border-left:9px solid #6b4423;border-right:9px solid #6b4423;margin-top:-2px}
.omk-paper{display:flex;align-items:center;justify-content:center;background:#fffdf6;box-shadow:0 3px 0 #ece5d6,0 6px 0 #d9d2c4,0 10px 14px rgba(0,0,0,.35);padding:14px 0;margin:0 6px;box-sizing:border-box}
.omk-name{writing-mode:vertical-rl;text-orientation:upright;font-family:'Yuji Syuku',serif;color:#141010;line-height:1.1;letter-spacing:.02em;max-height:100%;text-align:center}
.omk-ring{position:absolute;top:-8px;width:9px;height:12px;border:2px solid #8a8f95;border-radius:5px;z-index:3}
.omk-feet{display:block;height:8px;margin-top:22px;background:linear-gradient(90deg,#4a2e17 0 30px,transparent 30px calc(100% - 30px),#4a2e17 calc(100% - 30px))}
.omk-n{margin-top:8px;font-weight:700;font-size:14px;color:var(--ink);white-space:nowrap}
.omk:focus-visible .omk-paper,.omk:hover .omk-paper{outline:3px solid #ffd21f;outline-offset:3px}
.omswipe{text-align:center;color:var(--mute);font-size:12px;margin:6px 0 0}
.omgrid{list-style:none;margin:0;padding:0;display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.omg{width:100%;height:80px;overflow:hidden;display:flex;align-items:center;gap:10px;background:#241b16;color:#fff;border:0;border-left:5px solid #b42d18;border-radius:12px;padding:8px 10px;cursor:pointer;text-align:left;min-height:64px}
.omg .lmk{flex:none}.omn{display:flex;flex-direction:column;min-width:0}.omn b{font-size:14px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25}.omn small{color:#bfb3a8;font-size:12px}
.omback{margin:0 0 8px}.omgh{display:flex;align-items:center;gap:12px;margin:0 0 10px}.omgh h2{margin:0}.omgh p{margin:2px 0 0;color:var(--mute);font-size:13px}
.lplay.off{background:#4a3d34;box-shadow:none;font-size:18px}
.omnew{font-size:12px;color:#bfb3a8}.omstar{color:#ffd21f}
.omrate{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.omrate .rb{min-height:40px;font-size:12px;padding:4px 2px;white-space:nowrap}
.omhint{color:var(--mute);font-size:13px;text-align:center}
.lg2{list-style:none;margin:0 auto;padding:0;display:grid;gap:8px;max-width:720px}
.lc2{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"mk main side" "mk act side";gap:4px 10px;align-items:center;padding:8px 10px;border-radius:12px;color:#fff;background:radial-gradient(ellipse 60% 90% at 45% 30%,#4b3a2c 0,#241b16 70%,#1d1714 100%);border-left:7px solid #b42d18;border-right:7px solid #b42d18;box-shadow:inset 0 4px 0 #8f2312}
.mk2{display:flex;background:#6b4423;padding:4px;border-radius:4px;box-shadow:0 2px 0 #4a2e17}
.mk2 span{display:flex;align-items:center;justify-content:center;background:#fffdf6;height:92px;box-sizing:border-box;padding:6px 3px}.mk2 em i{display:block;font-style:normal}.lleft{grid-area:mk;align-self:center;display:flex;flex-direction:column;align-items:center;gap:4px}.lleft time{font-size:11px;color:#bfb3a8;white-space:nowrap}

.sw input:checked+i{background:var(--yel)}

.sw input:focus-visible+i{outline:2px solid #fff;outline-offset:2px}
.cdone{font:inherit;font-size:14px;font-weight:700;background:var(--yel);color:#1d1714;border:0;border-radius:10px;padding:8px 18px;cursor:pointer}

<div id="sheet" class="sheet" hidden>

  <form id="form" class="panel" novalidate>
    <h2 id="fTitle">ネタを記録する</h2>
    <p class="small" style="margin:0">漫才とコントのみ。バラエティ番組やトーク、YouTube企画は対象外です。</p>
    <label>コンビ・グループ名<input id="fGroup" list="glist" autocomplete="off" placeholder="例：ミルクボーイ"></label>
    <datalist id="glist"></datalist>
    <div id="fNew" hidden>
      <label>ブレイクした年（任意）<input id="fPeak" type="number" min="1950" max="2100" inputmode="numeric" placeholder="例：2019"></label>
      <p class="small">新しいグループとして登録されます。ブレイク年はお笑い年齢の計算に使います。</p>
    </div>
    <label>ネタの題名（任意）<input id="fT" maxlength="200" placeholder="例：コーンフレーク"></label>
    <label>ひとこと（任意・自分用メモ）<textarea id="fNote" maxlength="500" rows="2" placeholder="例：ツッコミ最高"></textarea></label>
    <label>YouTubeのリンク（任意）<input id="fUrl" type="url" placeholder="https://youtu.be/…"></label>
    <label>長さ・分（任意、視聴時間の計算用）<input id="fDur" type="number" min="0" max="300" step="0.5" inputmode="decimal" placeholder="例：5"></label>
    <fieldset><legend>形式</legend><div class="seg" id="fFmt"><button type="button" data-f="m">漫才</button><button type="button" data-f="k">コント</button></div></fieldset>

    <fieldset><legend>評価</legend><div class="lr" id="fRate"></div></fieldset>

    <div class="row"><button type="button" class="btn ghost" data-close>キャンセル</button><button type="submit" class="btn">保存</button></div>
  </form>

async function rateCur(r){
  const y=S.cur;if(!y||!VID[y]||S.anim)return;const {g,v}=VID[y],id='v-'+y,st=$('#stage');r=String(r);
  S.anim=true;S.later=false;st.classList.add('busy');st.querySelectorAll('.rb').forEach(b=>b.disabled=true);

  const doc={kind:'w',fav:false,gid:g.id,gname:g.name,vid:y,sec:v.d,title:v.t,url:ytUrl(y,v.s),fmt:v.f,side:v.side||null,styles:(v.tags||g.styles).slice(),r:Number(r),at:new Date().toISOString(),ver:VERSION,...(memo?{note:memo}:{})};
  const n0=yoseN();

  if(toDev)sendFeedback({source:'comment',kind:'comment',text:memo,vid:y,gid:g.id,gname:g.name,title:v.t,r:Number(r)});
  // ★推す: after ウケた, a 3-second countdown (ring + number) that runs while the curtain closes
  let lt=null,cdn=null;
  const CD=3000;
  const countdown=()=>new Promise(res=>{const t0=performance.now(),rg=lt.querySelector('.ring rect'),nm=cdn.querySelector('span');let shown=3;
    const tick=()=>{const t=performance.now()-t0,left=Math.max(0,CD-t),n=Math.max(1,Math.ceil(left/1000));
      if(rg)rg.style.strokeDashoffset=String(100*(1-left/CD));
      if(n!==shown){shown=n;nm.textContent=n;cdn.classList.remove('tk');void cdn.offsetWidth;cdn.classList.add('tk')}
      if(t>=CD)res();else requestAnimationFrame(tick)};requestAnimationFrame(tick)});
  if(uke){
    st.insertAdjacentHTML('beforeend','<button type="button" class="later cd" data-later aria-pressed="false"><svg class="ring" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><rect x="2" y="2" width="96" height="96" rx="16" ry="18" pathLength="100"/></svg><b aria-hidden="true">★</b><span>推す！</span></button><p class="cdn telop" aria-hidden="true"><span>3</span><small>秒後に次の出番</small></p>');
    lt=st.querySelector('.later.cd');cdn=st.querySelector('.cdn');

      lt.insertAdjacentHTML('beforebegin','<p class="stamp telop s1">ウケた！</p><div class="drape cd"><i class="dl"></i><i class="dr"></i></div>');
      await wait(450);

    }else{
      st.insertAdjacentHTML('beforeend',`<p class="stamp telop s${r}">${r==='-1'?'スベった…':R[r]}</p><div class="drape"><i class="dl"></i><i class="dr"></i></div>`);
      await wait(600);
      st.querySelector('.drape').classList.add('shut');
      await Promise.all([saving,wait(520)]);

    const fav=uke&&S.later;
    const prev=y;S.cur=null;renderWatch(true);
    if(rm){st.style.opacity='1'}
    else{
      const D=document.createElement('div');D.className='drape shut'+(uke?' mid':'');D.innerHTML='<i class="dl"></i><i class="dr"></i>';
      st.appendChild(D);D.getBoundingClientRect();await wait(140);D.classList.remove('shut');await wait(uke?1500:540);D.remove();
    }

    toast(bonus+(fav?'★推した · ':'')+R[r]+'　次の出番へ',[['取り消す',async()=>{await del('v-'+prev);S.cur=prev;S.played[prev]=true;saveNow();renderWatch(true)}]]);
  }catch(x){toast('保存できませんでした（'+(x&&x.code||'error')+'）');st.style.opacity='1';S.anim=false;renderWatch(true)}

function diagnose({age,v,fav,sAll,E,bestLen,fm,fk,fp=[],spn=null,sNP=null}){

  const shorts={YS:'ドパガキ',YT:'考察厨',OS:'無理してる大人',OT:'おやじギャグおやじ'};
  const k=(young?'Y':'O')+(stim?'S':'T');
  const lines=[];
  lines.push(isM?'マイク一本の勝負じゃないと興奮できない。セットや小道具は甘えだと思っている。':'設定とオチがないと落ち着かない。漫才の雑談パートで毎回スマホを見ている。');
  lines.push(sweet?'笑いの沸点が低すぎる。たぶん箸が転んでも笑う。':'笑いの沸点が高すぎて、芸人より審査員になりたいタイプ。');
  const bored=E.filter(e=>e.r===-2).length;
  if(bored&&bored/E.length>=.15)lines.push(`集中力の持続時間はだいたい4分。途中でやめた率${Math.round(bored/E.length*100)}%。`);
  if(bestLen&&bestLen.l==='〜4分')lines.push('5分を超えるネタは、もはや長編映画。');
  else if(bestLen&&(bestLen.l==='8〜15分'||bestLen.l==='15分〜'))lines.push('単独ライブの長尺ネタを「通」ぶって観ている。');
  if(fav&&fav.k==='edgy')lines.push('毒舌にしか反応しない。友達が少ないのでは。');
  if(fav&&fav.k==='surreal')lines.push('「シュールが分かる自分」が好き。');
  if(fp.length>=2&&spn!=null&&sNP!=null&&spn-sNP>=15)lines.push('ピン好き。ひとりで全部背負う芸人に自分を重ねている。コンビ芸人をちょっと信用していない。');

}

  if(v==='watch'||v==='enq'||isAdmin())return true;
  if(isOld())return true;
  const n=yoseN();
  if(v==='oneman'||v==='enqAll')return n>=3;
  if(v==='log'||v==='stats')return n>=20;
  return true;
}
function renderTabs(){
  const n=yoseN();
  $$('.tabs a').forEach(a=>{const v=a.dataset.v,lk=!unlocked(v),need=v==='oneman'?3:20;a.classList.toggle('locked',lk);a.setAttribute('aria-disabled',String(lk));
    let sm=a.querySelector('.lk');if(lk){if(!sm){sm=document.createElement('small');sm.className='lk';a.appendChild(sm)}sm.textContent='🔒あと'+Math.max(1,need-n)+'本'}else if(sm)sm.remove()});
  const al=$('#admLink');if(al)al.hidden=!isAdmin();
  const c=$('#ccount');if(c)c.textContent=CAT.length+'組・'+Object.keys(VID).length+'本';
}
function afterRate(n0){
  if(S.user&&S.fb){const {fs,db}=S.fb;fs.setDoc(fs.doc(db,'profiles',S.user.uid),{name:(S.user.displayName||'').slice(0,60),last:new Date().toISOString(),n:S.entries.length,ver:VERSION},{merge:true}).catch(()=>{})}
  if(isOld())return '';
  const n=n0+1;let m='';
  if(n0<3&&n>=3)m+='🎉ワンマン解禁！ワンマンチケット1枚プレゼント · ';
  else if(Math.floor(n/10)>Math.floor(n0/10))m+='🎫ワンマンチケット＋1 · ';
  if(n0<20&&n>=20)m+='🎉記録・WBTI診断 解禁 · ';
  setTimeout(renderTabs,50);return m;
}

/* v1.3: feedback (アンケート + memos sent to the developer) */
const FB_OUT='uketa-fb-outbox';
async function sendFeedback(o){
  const p={text:'',...o,at:new Date().toISOString(),ver:VERSION,login:!!S.user,golden:!!S.noShimo,nRated:S.entries.length,uid:S.user?S.user.uid:null,name:S.user?(S.user.displayName||'').slice(0,60):'',ua:String(navigator.userAgent||'').slice(0,180)};
  Object.keys(p).forEach(k=>{if(typeof p[k]==='string')p[k]=p[k].slice(0,k==='text'?1500:300)});
  try{
    if(S.fb){await S.fb.fs.addDoc(S.fb.fs.collection(S.fb.db,'feedback'),p);return true}
    if(window.claude&&window.claude.use){const db=await window.claude.use('db');if(db){await db.collection('data/feedback').doc(nid('f')).set(p);return true}}
    throw new Error('offline');
  }catch(e){try{const a=JSON.parse(localStorage.getItem(FB_OUT)||'[]');a.push(p);localStorage.setItem(FB_OUT,JSON.stringify(a.slice(-50)))}catch(x){}
    if(o.source==='comment')toast('ひとことは保存しました（開発者への送信はできませんでした）');return false}
}

function addExtra(x){
  if(!x||!x.y||VID[x.y])return false;
  let g=CAT.find(c=>c.id===x.gid)||CAT.find(c=>c.name===x.gname);
  if(!g){g={id:x.gid||('x-'+x.y),name:x.gname,ro:x.gro||'',fmt:x.gfmt||(x.f==='p'?'p':x.f)||'m',styles:(x.tags||[]).slice(0,2),peak:x.peak||null,fan:x.peak?Math.min(75,Math.max(12,YEAR-x.peak+16)):null,note:x.gnote||'',v:[],extra:true};CAT.push(g)}

  g.v.push(v);VID[x.y]={g,v};return true;
}
async function loadExtras(){
  if(!S.fb)return;const {fs,db}=S.fb;
  try{const sn=await fs.getDocs(fs.collection(db,'catalog'));let n=0;const D=sn.docs.map(d=>d.data());D.filter(x=>!x.o).forEach(x=>{if(addExtra(x))n++});D.filter(x=>x.o).forEach(x=>{if(applyOvr(x))n++});if(n)render();else renderTabs()}catch(e){}
}
